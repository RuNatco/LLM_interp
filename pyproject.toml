[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-clt-circuit-baseline"
version = "0.1.0"
description = "Small-scale Cross-Layer Transcoder baseline for Qwen2.5 base and instruct models"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
