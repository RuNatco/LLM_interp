name: qwen-clt

x-base: &base
  build: .
  working_dir: /workspace
  ipc: host
  volumes:
    - ./outputs:/workspace/outputs
    - ./configs:/workspace/configs
    - ./scripts:/workspace/scripts
    - hf_cache:/workspace/.cache/huggingface
  environment: &base-env
    HF_HOME: /workspace/.cache/huggingface
    NCCL_DEBUG: WARN
    NCCL_IB_DISABLE: "1"
    NCCL_P2P_DISABLE: "0"
    OMP_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"

x-gpu-multi: &gpu-multi
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${GPUS:-1}
            capabilities: [gpu]

x-gpu-single: &gpu-single
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:

  train:
    <<: [*base, *gpu-multi]
    command: >
      bash scripts/run.sh
      --gpus ${GPUS:-1}
      --config ${CONFIG:-configs/qwen2_5_0_5b_base_clt_recon_fidelity_v2.yaml}

  pipeline:
    <<: [*base, *gpu-multi]
    command: >
      bash scripts/11_run_final_training_pipeline.sh
      --gpus ${GPUS:-1}

  eval:
    <<: [*base, *gpu-single]
    entrypoint: ["python3", "scripts/02_eval_replacement_model.py"]
    command:
      - "--config"
      - "configs/qwen2_5_0_5b_base_clt_recon_fidelity_v2_continue_v2.yaml"

  deep-trace:
    <<: [*base, *gpu-single]
    entrypoint: ["python3", "scripts/09_build_deep_trace_prompt_suite.py"]
    command:
      - "--checkpoint"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/clt_final.pt"
      - "--output-dir"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/deep_trace_suite"
      - "--summary-output"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/deep_trace_suite_summary.json"
      - "--max-feature-nodes"
      - "64"
      - "--top-error-nodes"
      - "8"
      - "--causal-top-k"
      - "8"

volumes:
  hf_cache:
