name: qwen-clt

# ── shared base ──────────────────────────────────────────────────────────────
x-base: &base
  build: .
  working_dir: /workspace
  ipc: host           # DDP requires shared memory across processes
  volumes:
    - ./outputs:/workspace/outputs
    - ./configs:/workspace/configs
    - ./scripts:/workspace/scripts
    - hf_cache:/workspace/.cache/huggingface
    - tok_cache:/workspace/.cache/tokenized
  environment: &base-env
    HF_HOME: /workspace/.cache/huggingface
    NCCL_DEBUG: WARN
    NCCL_IB_DISABLE: "1"
    NCCL_P2P_DISABLE: "0"
    OMP_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"

# ── services ─────────────────────────────────────────────────────────────────
services:

  # --------------------------------------------------------------------------
  # 1-GPU training
  #   docker compose run --rm train-1gpu
  #   docker compose run --rm train-1gpu bash scripts/run.sh --gpus 1 \
  #       --config configs/qwen2_5_0_5b_4096f_v1.yaml
  # --------------------------------------------------------------------------
  train-1gpu:
    <<: *base
    command: >
      bash scripts/run.sh
      --gpus 1
      --config configs/qwen2_5_0_5b_4096f_v1.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # --------------------------------------------------------------------------
  # 2-GPU training (DDP, torchrun)
  #   docker compose run --rm train-2gpu
  #   docker compose run --rm train-2gpu bash scripts/run.sh --gpus 2 \
  #       --config configs/qwen2_5_0_5b_4096f_v1_2gpu.yaml
  # --------------------------------------------------------------------------
  train-2gpu:
    <<: *base
    command: >
      bash scripts/run.sh
      --gpus 2
      --config configs/qwen2_5_0_5b_4096f_v1_2gpu.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

  # --------------------------------------------------------------------------
  # Replacement model evaluation (rank-0 only, 1 GPU)
  #   docker compose run --rm eval --config configs/qwen2_5_0_5b_4096f_v1_2gpu.yaml
  # --------------------------------------------------------------------------
  eval:
    <<: *base
    entrypoint: ["python3", "scripts/02_eval_replacement_model.py"]
    command: ["--config", "configs/qwen2_5_0_5b_4096f_v1_2gpu.yaml"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

# ── named volumes (persist across container restarts) ────────────────────────
volumes:
  hf_cache:   # HuggingFace model weights + dataset cache
  tok_cache:  # pre-tokenized dataset chunks (speeds up re-runs)
