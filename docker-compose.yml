name: qwen-clt

# ── shared base ──────────────────────────────────────────────────────────────
x-base: &base
  build: .
  working_dir: /workspace
  ipc: host           # DDP requires shared memory across processes
  volumes:
    - ./outputs:/workspace/outputs
    - ./configs:/workspace/configs
    - ./scripts:/workspace/scripts
    - hf_cache:/workspace/.cache/huggingface
  environment: &base-env
    HF_HOME: /workspace/.cache/huggingface
    NCCL_DEBUG: WARN
    NCCL_IB_DISABLE: "1"
    NCCL_P2P_DISABLE: "0"
    OMP_NUM_THREADS: "1"
    TOKENIZERS_PARALLELISM: "false"

# Multi-GPU services reserve exactly ${GPUS} cards (default 1); the same value
# is passed to torchrun (--nproc_per_node). To pick which physical cards are
# used, set CUDA_VISIBLE_DEVICES.
x-gpu-multi: &gpu-multi
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: ${GPUS:-1}
            capabilities: [gpu]

# Eval / Deep Trace run on a single process -> exactly 1 GPU.
x-gpu-single: &gpu-single
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

# ── services ─────────────────────────────────────────────────────────────────
services:

  # --------------------------------------------------------------------------
  # Training only (1 stage), N-GPU.
  #   GPUS=4 docker compose run --rm train
  #   GPUS=2 CONFIG=configs/..._continue_v1.yaml docker compose run --rm train
  # --------------------------------------------------------------------------
  train:
    <<: [*base, *gpu-multi]
    command: >
      bash scripts/run.sh
      --gpus ${GPUS:-1}
      --config ${CONFIG:-configs/qwen2_5_0_5b_base_clt_recon_fidelity_v2.yaml}

  # --------------------------------------------------------------------------
  # Full reproducible pipeline: train (3 stages, N-GPU) -> eval+baselines
  # -> Deep Trace. Eval and Deep Trace run on a single process.
  #   GPUS=4 docker compose run --rm pipeline
  #   GPUS=4 docker compose run --rm pipeline \
  #       bash scripts/11_run_final_training_pipeline.sh --gpus 4 --skip-train
  # --------------------------------------------------------------------------
  pipeline:
    <<: [*base, *gpu-multi]
    command: >
      bash scripts/11_run_final_training_pipeline.sh
      --gpus ${GPUS:-1}

  # --------------------------------------------------------------------------
  # Replacement-model eval on the final checkpoint (control baselines included
  # via the config's replacement_eval.baselines block). Single GPU.
  #   docker compose run --rm eval
  # --------------------------------------------------------------------------
  eval:
    <<: [*base, *gpu-single]
    entrypoint: ["python3", "scripts/02_eval_replacement_model.py"]
    command:
      - "--config"
      - "configs/qwen2_5_0_5b_base_clt_recon_fidelity_v2_continue_v2.yaml"

  # --------------------------------------------------------------------------
  # Deep Trace stage-2 prompt suite on the final checkpoint. Single GPU.
  #   docker compose run --rm deep-trace
  # --------------------------------------------------------------------------
  deep-trace:
    <<: [*base, *gpu-single]
    entrypoint: ["python3", "scripts/09_build_deep_trace_prompt_suite.py"]
    command:
      - "--checkpoint"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/clt_final.pt"
      - "--output-dir"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/deep_trace_suite"
      - "--summary-output"
      - "outputs/base_clt_recon_fidelity_v2_continue_v2/deep_trace_suite_summary.json"
      - "--max-feature-nodes"
      - "64"
      - "--top-error-nodes"
      - "8"
      - "--causal-top-k"
      - "8"

# ── named volumes (persist across container restarts) ────────────────────────
volumes:
  hf_cache:   # HuggingFace model weights + dataset cache (incl. tokenized map cache)
