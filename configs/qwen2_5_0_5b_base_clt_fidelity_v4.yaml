project:
  name: qwen2_5_0_5b_base_clt_fidelity_v4
  output_dir: outputs/base_clt_fidelity_v4

model:
  name: Qwen/Qwen2.5-0.5B
  dtype: bfloat16
  device: cuda
  trust_remote_code: true
  use_cache: false
  chat_template: false

data:
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  text_field: text
  split: train
  seq_len: 128
  max_train_tokens: 25000000
  max_eval_tokens: 200000

clt:
  n_layers: 24
  d_model: 896
  features_per_layer: 1024
  input_kind: mlp_normed_input
  nonlinearity: jumprelu
  init_threshold: 0.0
  decoder_init_scale: 0.02
  normalization:
    enabled: true
    normalize_inputs: true
    normalize_targets: true
    eps: 0.00001
    momentum: 0.01

training:
  batch_size_sequences: 8
  gradient_accumulation_steps: 2
  lr: 0.0002
  weight_decay: 0.0
  lambda_sparsity: 0.00002
  sparsity_c: 1.0
  max_optimizer_steps: 10000
  log_every: 25
  eval_every: 250
  save_every: 500
  keep_last_checkpoints: 3
  grad_clip_norm: 1.0
  seed: 42
  logit_distillation:
    enabled: true
    weight: 0.05
    every_n_micro_steps: 1
    top_k: 256
    temperature: 2.0
    normalize_logits: true
    loss_type: centered_mse

replacement:
  enabled: true
  checkpoint_path: outputs/base_clt_fidelity_v4/clt_final.pt
  read_from: mlp_normed_input
  replace_at: mlp_output
  replace_mode: full
  detach_reconstruction: false

replacement_eval:
  enabled: true
  max_eval_tokens: 50000
  batch_size_sequences: 64
  output_path: outputs/base_clt_fidelity_v4/replacement_eval_metrics.json
  metrics:
    - kl_div
    - logit_mse
    - top1_agreement
    - mean_abs_logit_diff
    - last_token_kl_div
    - last_token_top1_agreement
  target_logit_diff:
    positive: " increase"
    negative: " decrease"
    target_pos: -1
  diagnostics:
    enabled: false
    max_eval_tokens: 5000
    layerwise: true
    layer_stride: 1
    prefix: true
    prefix_stride: 1
  save_batch_metrics: true
