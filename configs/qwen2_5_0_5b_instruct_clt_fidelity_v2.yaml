project:
  name: qwen2_5_0_5b_instruct_clt_fidelity_v2
  output_dir: outputs/instruct_clt_fidelity_v2

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  dtype: bfloat16
  device: cuda
  trust_remote_code: true
  use_cache: false
  chat_template: true

data:
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  text_field: text
  split: train
  seq_len: 128
  max_train_tokens: 25000000
  max_eval_tokens: 200000
  instruct_wrapper:
    system: "You are a helpful assistant."
    user_prefix: "Continue or answer the following text:"

clt:
  n_layers: 24
  d_model: 896
  features_per_layer: 1024
  input_kind: mlp_normed_input
  nonlinearity: jumprelu
  init_threshold: 0.0
  decoder_init_scale: 0.02

training:
  batch_size_sequences: 16
  gradient_accumulation_steps: 1
  lr: 0.0003
  weight_decay: 0.0
  lambda_sparsity: 0.00002
  sparsity_c: 1.0
  max_optimizer_steps: 10000
  log_every: 25
  eval_every: 250
  save_every: 1000
  keep_last_checkpoints: 3
  grad_clip_norm: 1.0
  seed: 42

replacement:
  enabled: true
  checkpoint_path: outputs/instruct_clt_fidelity_v2/clt_final.pt
  read_from: mlp_normed_input
  replace_at: mlp_output
  replace_mode: full
  detach_reconstruction: false

replacement_eval:
  enabled: true
  max_eval_tokens: 50000
  batch_size_sequences: 64
  output_path: outputs/instruct_clt_fidelity_v2/replacement_eval_metrics.json
  metrics:
    - kl_div
    - logit_mse
    - top1_agreement
    - mean_abs_logit_diff
    - last_token_kl_div
    - last_token_top1_agreement
  target_logit_diff:
    positive: " increase"
    negative: " decrease"
    target_pos: -1
  diagnostics:
    enabled: false
    max_eval_tokens: 5000
    layerwise: true
    layer_stride: 1
    prefix: true
    prefix_stride: 1
  save_batch_metrics: true
