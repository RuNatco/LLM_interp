project:
  name: qwen2_5_0_5b_4096f_v1
  output_dir: outputs/4096f_v1

model:
  name: Qwen/Qwen2.5-0.5B
  dtype: bfloat16
  device: cuda
  trust_remote_code: true
  use_cache: false
  chat_template: false

data:
  dataset_name: wikitext
  dataset_config: wikitext-103-raw-v1
  text_field: text
  split: train
  eval_split: test
  seq_len: 128
  max_train_tokens: 200000000   # 200M — вчетверо больше предыдущего
  max_eval_tokens: 400000       # ~200k токенов на eval

clt:
  n_layers: 24
  d_model: 896
  features_per_layer: 4096      # expansion ~4.6x (vs 2.3x ранее)
  input_kind: mlp_normed_input
  nonlinearity: jumprelu
  init_threshold: 0.1           # небольшой порог при инициализации, чтобы
                                  # JumpReLU не проходил всё сразу
  decoder_init_scale: 0.02

training:
  batch_size_sequences: 16
  eval_batch_size_sequences: 32
  gradient_accumulation_steps: 2  # эффективный batch = 32 последовательностей
  lr: 0.0002
  weight_decay: 0.01              # небольшой L2 для регуляризации декодеров
  # LR scheduler: linear warmup + cosine decay до 10% base LR
  lr_scheduler:
    enabled: true
    warmup_steps: 500
    min_lr_ratio: 0.1
  # Sparsity: λ нарастает с 0 до target за первые 1000 шагов,
  # чтобы дать модели сначала выучить реконструкцию
  lambda_sparsity: 0.00005
  sparsity_warmup_steps: 1000
  sparsity_c: 1.0
  # Per-layer sparsity: deep layers (L23 и около) получают в 4× больший штраф,
  # чтобы противодействовать накоплению cross-layer decoder путей
  layer_sparsity_weights:
    mode: quadratic   # квадратичный рост — максимальное давление на самые глубокие слои
    min_weight: 1.0
    max_weight: 4.0
  max_optimizer_steps: 30000
  log_every: 50
  eval_every: 500               # eval на тестовом сплите каждые 500 шагов
  save_every: 5000
  keep_last_checkpoints: 1
  grad_clip_norm: 1.0
  seed: 42

replacement:
  enabled: true
  checkpoint_path: outputs/4096f_v1/clt_final.pt
  read_from: mlp_normed_input
  replace_at: mlp_output
  replace_mode: full
  detach_reconstruction: false

replacement_eval:
  enabled: true
  max_eval_tokens: 50000
  batch_size_sequences: 64
  output_path: outputs/4096f_v1/replacement_eval_metrics.json
  metrics:
    - kl_div
    - logit_mse
    - top1_agreement
    - mean_abs_logit_diff
    - last_token_kl_div
    - last_token_top1_agreement
  target_logit_diff:
    positive: " increase"
    negative: " decrease"
    target_pos: -1
  diagnostics:
    enabled: false
    max_eval_tokens: 5000
    layerwise: true
    layer_stride: 1
    prefix: true
    prefix_stride: 1
  save_batch_metrics: false
